<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16130f" />
    <meta name="description" content="D&D 3.5e 中文房规资料库：扩展技法。支持全文搜索、类型筛选与规则直达链接。" />
    <meta property="og:title" content="扩展技法｜3R Homebrew" />
    <meta property="og:description" content="为 D&D 3.5e 整理的 278 项扩展技法中文规则。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trafifholz.github.io/3r-homebrew/" />
    <meta property="og:image" content="https://trafifholz.github.io/3r-homebrew/assets/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="扩展技法｜3R Homebrew" />
    <meta name="twitter:description" content="为 D&D 3.5e 整理的 278 项扩展技法中文规则。" />
    <meta name="twitter:image" content="https://trafifholz.github.io/3r-homebrew/assets/og-cover.png" />
    <title>扩展技法｜3R Homebrew</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="3R Homebrew 首页"><span class="brand-mark" aria-hidden="true">3R</span><strong>Homebrew</strong></a>
      <nav aria-label="主导航">
        <a href="index.html" aria-current="page">扩展技法</a>
        <a href="domain-feats.html">领域专长</a>
        <a href="feats.html">专长</a><a href="cleric-variants.html">牧师</a><a href="scout-rework.html">斥候</a><a href="ranger-update.html">巡林客</a><a href="rogue-update.html">游荡者</a><a href="bard-movements.html">诗人</a><a href="prestige-classes.html">进阶职业</a><a href="harrowing.html">哈罗占卜</a><a href="harrow-equipment.html">装备</a>
        <a href="https://github.com/TraFifholz/3r-homebrew" target="_blank" rel="noreferrer">GitHub ↗</a>
      </nav>
    </header>
    <main>
      <section class="library section-shell" id="library" aria-labelledby="library-title">
        <div class="section-heading library-heading">
          <div><p class="eyebrow">规则索引 · 278 项</p><h2 id="library-title">扩展技法</h2></div>
          <p id="result-count" role="status" aria-live="polite">正在载入规则……</p>
        </div>

        <div class="toolbar" aria-label="技法筛选工具">
          <label class="search-box">
            <span class="sr-only">搜索技法</span>
            <span aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="搜索名称、前提或规则文字…" autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <div class="type-filters" id="type-filters" role="group" aria-label="按技法类型筛选">
            <button class="filter is-active" type="button" data-type="全部" aria-pressed="true">全部</button>
            <button class="filter" type="button" data-type="操作技法" aria-pressed="false">操作</button>
            <button class="filter" type="button" data-type="精神技法" aria-pressed="false">精神</button>
            <button class="filter" type="button" data-type="移动技法" aria-pressed="false">移动</button>
            <button class="filter" type="button" data-type="交流技法" aria-pressed="false">交流</button>
            <button class="filter" type="button" data-type="基础技法" aria-pressed="false">基础</button>
          </div>
        </div>

        <div class="technique-list" id="technique-list"></div>
        <div class="empty-state" id="empty-state" hidden>
          <p class="empty-glyph" aria-hidden="true">∅</p>
          <h3>没有找到对应技法</h3>
          <p>试试缩短关键词，或切换到其他技法类型。</p>
          <button class="button button-ghost" id="clear-filters" type="button">清除筛选</button>
        </div>
        <button class="load-more" id="load-more" type="button" hidden>显示更多</button>

        <template id="technique-template">
          <article class="technique-card">
            <div class="card-index" aria-hidden="true"></div>
            <div class="card-body">
              <header>
                <div><p class="type-label"></p><h3></h3></div>
                <button class="copy-link" type="button" title="复制此技法的链接" aria-label="复制此技法的链接">链接</button>
              </header>
              <dl class="rule-block">
                <div class="prerequisite"><dt>前提</dt><dd></dd></div>
                <div class="effect"><dt>效果</dt><dd></dd></div>
                <div class="specials"><dt>特殊</dt><dd><ul></ul></dd></div>
              </dl>
            </div>
          </article>
        </template>
      </section>
    </main>
  </body>
</html>
